"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
${custom.git_branch_outside_home}\
$git_status\
$cmd_duration\
$line_break\
$character"""

[username]
style_user = "#d33682"
style_root = "bold #dc322f"
format = "[$user]($style) | "
show_always = true

[hostname]
style = "#93a1a1"
disabled = true
format = "[$hostname]($style) "
ssh_only = false
aliases = { "MacBook-Air" = "air" }

[directory]
style = "#268bd2"
format = "[$path]($style) "
truncation_length = 3

[git_branch]
disabled = true

[custom.git_branch_outside_home]
command = "git branch --show-current"
when = 'test "$PWD" != "$HOME" && git rev-parse --is-inside-work-tree >/dev/null 2>&1'
format = " :: [git:$output]($style)"
style = "#93a1a1"
shell = ["zsh", "--no-rcs"]

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#93a1a1"

[git_status]
format = " $all_status$ahead_behind"
style = "#2aa198"
conflicted = "!"
untracked = "?"
modified = "*"
staged = "+"
renamed = ">"
deleted = "x"
stashed = "$"
ahead = "^"
behind = "v"
diverged = "<>"
up_to_date = ""
[cmd_duration]
format = " took:$duration "
style = "#b58900"

[haskell]
symbol = "λ"
style = "#6c71c4"
format = '([$symbol $version]($style) )'

[python]
format = "[$virtualenv]($style) "
style = "#93a1a1"
detect_extensions = []
detect_files = []

[character]
success_symbol = "[λ](#586e75)"
error_symbol = "[λ](#dc322f)"
vimcmd_symbol = "[λ](#859900)"
