#:schema https://yazi-rs.github.io/schemas/theme.json

# Sunbather light: #ffffff / #262626, with the shared pink, green and blue accents.
# Structural separators stay ASCII so Yazi matches Neovim and tmux.
[app]
overall = { bg = "#ffffff" }

[mgr]
cwd = { fg = "#008ec4" }
find_keyword = { fg = "#5f4b00", bold = true, italic = true, underline = true }
find_position = { fg = "#ff5f87", bg = "#ffffff", bold = true, italic = true }
symlink_target = { fg = "#767676", italic = true }
marker_copied = { fg = "#ffffff", bg = "#10a778" }
marker_cut = { fg = "#ffffff", bg = "#c30771" }
marker_marked = { fg = "#ffffff", bg = "#20a5ba" }
marker_selected = { fg = "#262626", bg = "#d6b82c" }
marker_symbol = "|"
count_copied = { fg = "#ffffff", bg = "#10a778" }
count_cut = { fg = "#ffffff", bg = "#c30771" }
count_selected = { fg = "#262626", bg = "#d6b82c" }
border_symbol = "|"
border_style = { fg = "#a8a8a8" }

[tabs]
active = { fg = "#ff5f87", bold = true }
inactive = { fg = "#767676" }
sep_inner = { open = "[", close = "]" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#262626", bg = "#ff5f87", bold = true }
normal_alt = { fg = "#767676" }
select_main = { fg = "#ffffff", bg = "#10a778", bold = true }
select_alt = { fg = "#10a778" }
unset_main = { fg = "#ffffff", bg = "#c30771", bold = true }
unset_alt = { fg = "#c30771" }

[indicator]
padding = { open = "", close = "" }

[status]
overall = { fg = "#262626" }
sep_left = { open = "| ", close = "" }
sep_right = { open = "", close = " |" }
perm_sep = { fg = "#767676" }
perm_type = { fg = "#10a778" }
perm_read = { fg = "#5f4b00" }
perm_write = { fg = "#c30771" }
perm_exec = { fg = "#20a5ba" }
progress_label = { bold = true }
progress_normal = { fg = "#10a778", bg = "#eeeeee" }
progress_error = { fg = "#ffffff", bg = "#c30771" }

[which]
border = { fg = "#a8a8a8" }
cand = { fg = "#20a5ba" }
rest = { fg = "#767676" }
desc = { fg = "#a790d5" }
separator = " | "
separator_style = { fg = "#767676" }

[confirm]
border = { fg = "#a8a8a8" }
title = { fg = "#ff5f87" }
btn_yes = { fg = "#ffffff", bg = "#10a778", bold = true }

[spot]
border = { fg = "#a8a8a8" }
title = { fg = "#ff5f87" }
tbl_col = { fg = "#20a5ba" }
tbl_cell = { fg = "#262626", bg = "#d6b82c" }

[notify]
title_info = { fg = "#10a778" }
title_warn = { fg = "#5f4b00" }
title_error = { fg = "#c30771" }

[pick]
border = { fg = "#a8a8a8" }
active = { fg = "#ff5f87", bold = true }

[input]
border = { fg = "#a8a8a8" }

[cmp]
border = { fg = "#a8a8a8" }

[tasks]
border = { fg = "#a8a8a8" }
hovered = { fg = "#ff5f87", bold = true }

[help]
border = { fg = "#a8a8a8" }
chord = { fg = "#20a5ba" }
hovered = { reversed = true, bold = true }
