# AeroSpace configuration with i3-style bindings.
# Mod is Alt/Option to keep Cmd available for macOS application shortcuts.

config-version = 2
start-at-login = true
auto-reload-config = true

# Keep the tree predictable as windows are added and moved.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

# Keep the pointer centered when changing monitors.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

# Comfortable spacing around and between windows.
gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 8
gaps.outer.bottom = 8
gaps.outer.top = 8
gaps.outer.right = 8

persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

[mode.main.binding]
    # Launch and window actions.
    alt-enter = 'exec-and-forget open -na Ghostty'
    alt-q = 'close'
    alt-f = 'fullscreen'
    alt-shift-space = 'layout floating tiling'

    # Focus windows with Vim keys.
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Move windows with Shift + Vim keys.
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Change the split orientation or cycle the layout.
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # Resize with fixed increments, or enter the Vim resize mode below.
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'
    alt-r = 'mode resize'

    # i3-style reload and a service mode for tree operations.
    alt-shift-c = 'reload-config'
    alt-shift-semicolon = 'mode service'

    # Workspaces.
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    # Send the focused window to a workspace.
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

[mode.resize.binding]
    # i3-style persistent resize mode.
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    enter = 'mode main'
    esc = 'mode main'

[mode.service.binding]
    esc = 'mode main'
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']
    h = ['join-with left', 'mode main']
    j = ['join-with down', 'mode main']
    k = ['join-with up', 'mode main']
    l = ['join-with right', 'mode main']
