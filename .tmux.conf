# tmux user configuration
# Reload with: prefix + r

# Prefix: Ctrl-a is easier to reach than the tmux default Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General behavior
set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep new panes and windows in the current directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Easier split bindings.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing; repeat while holding the prefix.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload configuration.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Vi keys in copy mode, with macOS clipboard integration.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Terminal and color support.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Solarized Light palette, matching Ghostty's iTerm2 Solarized Light theme.
set -g @solarized_base00 "#657b83"
set -g @solarized_base01 "#586e75"
set -g @solarized_base1 "#93a1a1"
set -g @solarized_base2 "#eee8d5"
set -g @solarized_base3 "#fdf6e3"
set -g @solarized_blue "#268bd2"

# Status line.
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#{@solarized_base2},fg=#{@solarized_base00}"
set -g window-status-format " #[fg=#{@solarized_base01}]#I:#W "
set -g window-status-current-format "#[fg=#{@solarized_base3},bg=#{@solarized_blue},bold] #I:#W #[default]"
set -g status-left "#[fg=#{@solarized_base3},bg=#{@solarized_base01},bold] #S #[default]"
set -g status-right "#[fg=#{@solarized_base01}] %Y-%m-%d %H:%M "
set -g pane-border-style "fg=#{@solarized_base1}"
set -g pane-active-border-style "fg=#{@solarized_blue}"
set -g pane-border-lines simple
