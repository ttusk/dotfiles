# tmux user configuration
# Reload with: prefix + r

# Prefix: Ctrl-a is easier to reach than the tmux default Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General behavior
set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep new panes and windows in the current directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Easier split bindings.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing; repeat while holding the prefix.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload configuration.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Vi keys in copy mode, with macOS clipboard integration.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Terminal and color support.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Adaptive palette; Doom One when macOS uses dark appearance.
if-shell 'defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark' \
    'set -g @theme_bg "#282c34"; set -g @theme_fg "#bbc2cf"; set -g @theme_muted "#5b6268"; set -g @theme_active_fg "#282c34"; set -g @theme_blue "#51afef"' \
    'set -g @theme_bg "#fdf6e3"; set -g @theme_fg "#657b83"; set -g @theme_muted "#586e75"; set -g @theme_active_fg "#fdf6e3"; set -g @theme_blue "#268bd2"'

# Status line.
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#{@theme_bg},fg=#{@theme_fg}"
set -g window-status-format " #[fg=#{@theme_muted}]#I:#W "
set -g window-status-current-format "#[fg=#{@theme_active_fg},bg=#{@theme_blue},bold] #I:#W #[default]"
set -g status-left "#[fg=#{@theme_active_fg},bg=#{@theme_muted},bold] #S #[default]"
set -g status-right "#[fg=#{@theme_muted}] %Y-%m-%d %H:%M "
set -g pane-border-style "fg=#{@theme_muted}"
set -g pane-active-border-style "fg=#{@theme_blue}"
set -g pane-border-lines simple
