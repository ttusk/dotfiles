# tmux user configuration
# Reload with: prefix + r

# Prefix: Ctrl-a is easier to reach than the tmux default Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General behavior
set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep new panes and windows in the current directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Easier split bindings.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Convert a stacked two-pane layout and place the active pane on the left.
bind-key '{' select-layout even-horizontal \; swap-pane -t '{left}'

# Vim-style pane resizing; repeat while holding the prefix.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload configuration.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Vi keys in copy mode, with macOS clipboard integration.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Terminal and color support.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Adaptive palette matching Starship, Ghostty and Neovim.
if-shell 'defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark' \
    'set -g @theme_bg "#000000"; set -g @theme_fg "#c6c6c6"; set -g @theme_muted "#4e4e4e"; set -g @theme_accent "#d75f87"; set -g @theme_branch "#767676"; set -g @theme_git "#5fd7a7"; set -g @theme_time "#a8a8a8"; set -g @theme_border "#767676"' \
    'set -g @theme_bg "#ffffff"; set -g @theme_fg "#262626"; set -g @theme_muted "#767676"; set -g @theme_accent "#ff5f87"; set -g @theme_branch "#767676"; set -g @theme_git "#10a778"; set -g @theme_time "#5f4b00"; set -g @theme_border "#a8a8a8"'

# Top status: git left, session and windows centered, context and time right.
set -g status-interval 5
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=#{@theme_bg},fg=#{@theme_fg}"
set -g window-status-format "#[fg=#{@theme_muted}]#I:#W #[default]"
set -g window-status-current-format "#[fg=#{@theme_accent},bold]#I:#W #[default]"
set -g status-left '#[fg=#{@theme_branch},bold]#(git -C #{q:pane_current_path} branch --show-current 2>/dev/null | sed "s/.*/[&]/")#[default]#[fg=#{@theme_git}]#(cd #{q:pane_current_path} && starship module git_status 2>/dev/null)#[default] '
set -g status-right '#[fg=#{@theme_accent}][#{s|^.*/([^/]+/[^/]+)$|\1|:pane_current_path}] #[fg=#{@theme_muted}]| #[fg=#{@theme_time}]%Y/%m/%d %H:%M #[default]'
set -g status-format[0] '#[align=left]#{E:status-left}#[list=on align=absolute-centre]#[fg=#{@theme_branch},bold]@#S #[default]#{W:#[range=window|#{window_index}]#{E:window-status-format}#[norange],#[range=window|#{window_index}]#{E:window-status-current-format}#[norange]}#[nolist]#[align=right]#{T:status-right}'
set -g pane-border-status off
# Pane separators: use a stronger neutral and accent color for clear divisions.
set -g pane-border-style "fg=#{@theme_border}"
set -g pane-active-border-style "fg=#{@theme_accent},bold"
set -g pane-border-lines simple
